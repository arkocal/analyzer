# Your goblint build, used in place (it finds its stub includes relative to its build tree, so
# don't copy the binary, and don't rebuild it while runs are in progress).
goblint: "../goblint"   # this repo's build
input_file: "bench/rsync-v3.4.1-gcc-nosignal.i"   # bench/ is copied from goblint/bench, see bench/SOURCE.md

solvers: [td3, wbu]   # each maps to solver-configs/<name>.json, applied after the bench config

# Per-run limits; 0 = no limit. A run that hits one is recorded as timeout / oom, not as a workflow failure.
timeout_s: 0
memory_limit_mb: 14000    # RLIMIT_AS; with mem_mb: 28000 in the profile, at most 2 runs at once

# Bench configs (bench/conf/<name>.json), with td3 times from the bench README for orientation.
configs:
  - unit                                                 # ~4 s, smoke test
  - large-program-string-unit-no-hashcons-no-assert      # ~1120 s
  - large-program-string-unit-no-hashcons-no-access      # ~1164 s
  - large-program-string-unit-no-hashcons-no-race        # ~1254 s
  - large-program-string-unit-no-hashcons-no-mutexEvents # ~1458 s
  - large-program-string-unit-no-hashcons-no-mutex       # ~1502 s
  - large-program-string-unit-no-hashcons                # ~1640 s
  - large-program-string-unit-no-hashcons-threadflag     # ~1892 s
  - large-program-string-unit                            # ~2600 s (hashconsing on, older build)
  - sim642-minimal3                                      # 5665 s .. 37639 s depending on build
  # Long (7 h+ with td3), enable when there is time:
  # - sim642-minimal2                                    # 9057 s .. 47526 s
  # - sim642-minimal4b                                   # ~26000 s
  # - sim642-minimal3b                                   # ~38372 s
  # Not included:
  # - jprotopopov*                (call_string contexts; ~31 h)
  # - *-no-earlyglobs             (OOM after 41 min with 30 GB)
